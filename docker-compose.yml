services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  qdrant-init:
    image: curlimages/curl:8.12.1
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-messages}
      DENSE_VECTOR_SIZE: ${DENSE_VECTOR_SIZE:-384}
    volumes:
      - ./scripts/qdrant_init.sh:/qdrant_init.sh:ro
    entrypoint: ["sh", "/qdrant_init.sh"]
    restart: "no"

  index:
    build:
      context: ./index
      args:
        SPARSE_MODEL_NAME: ${SPARSE_MODEL_NAME:-Qdrant/bm25}
    depends_on:
      - qdrant
    environment:
      MAX_CHUNK_CHARS: ${MAX_CHUNK_CHARS:-1600}
      OVERLAP_MESSAGE_COUNT: ${OVERLAP_MESSAGE_COUNT:-2}
      MAX_TIME_GAP_SECONDS: ${MAX_TIME_GAP_SECONDS:-10800}
      LONG_MESSAGE_CHAR_THRESHOLD: ${LONG_MESSAGE_CHAR_THRESHOLD:-1400}
      LONG_MESSAGE_LINE_THRESHOLD: ${LONG_MESSAGE_LINE_THRESHOLD:-30}
      TECHNICAL_PREVIEW_LINES: ${TECHNICAL_PREVIEW_LINES:-18}
      TECHNICAL_PREVIEW_CHARS: ${TECHNICAL_PREVIEW_CHARS:-1800}
      SPLIT_MESSAGE_CHAR_THRESHOLD: ${SPLIT_MESSAGE_CHAR_THRESHOLD:-1200}
      SPLIT_SEGMENT_TARGET_CHARS: ${SPLIT_SEGMENT_TARGET_CHARS:-650}
      SPARSE_MODEL_NAME: ${SPARSE_MODEL_NAME:-Qdrant/bm25}
      SPARSE_MODEL_LANGUAGE: ${SPARSE_MODEL_LANGUAGE:-russian}
    volumes:
      - index_models:/models
    ports:
      - "8001:8000"

  search:
    build:
      context: ./search
      args:
        DENSE_MODEL_NAME: ${DENSE_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
        SPARSE_MODEL_NAME: ${SPARSE_MODEL_NAME:-Qdrant/bm25}
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-messages}
      QDRANT_DENSE_VECTOR_NAME: dense
      QDRANT_SPARSE_VECTOR_NAME: sparse
      DENSE_MODEL_NAME: ${DENSE_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      DENSE_VECTOR_SIZE: ${DENSE_VECTOR_SIZE:-384}
      SPARSE_MODEL_NAME: ${SPARSE_MODEL_NAME:-Qdrant/bm25}
      SPARSE_MODEL_LANGUAGE: ${SPARSE_MODEL_LANGUAGE:-russian}
      FUSION_MODE: ${FUSION_MODE:-dbsf}
      MAX_DENSE_QUERIES: ${MAX_DENSE_QUERIES:-3}
      MAX_SPARSE_QUERIES: ${MAX_SPARSE_QUERIES:-3}
      DENSE_PREFETCH_K: ${DENSE_PREFETCH_K:-40}
      SPARSE_PREFETCH_K: ${SPARSE_PREFETCH_K:-40}
      RETRIEVE_K: ${RETRIEVE_K:-60}
      FINAL_MESSAGE_LIMIT: ${FINAL_MESSAGE_LIMIT:-50}
      POINT_RESCORE_ENABLED: ${POINT_RESCORE_ENABLED:-0}
      RESCORE_RANK_BONUS_MAX: ${RESCORE_RANK_BONUS_MAX:-0.2}
      RESCORE_RANK_BONUS_STEP: ${RESCORE_RANK_BONUS_STEP:-0.005}
      RESCORE_MESSAGE_HIT_WEIGHT: ${RESCORE_MESSAGE_HIT_WEIGHT:-0.04}
      RESCORE_CONTEXT_HIT_WEIGHT: ${RESCORE_CONTEXT_HIT_WEIGHT:-0.01}
      RESCORE_METADATA_HIT_WEIGHT: ${RESCORE_METADATA_HIT_WEIGHT:-0.02}
      ASSEMBLE_BLOCK_HIT_WEIGHT: ${ASSEMBLE_BLOCK_HIT_WEIGHT:-0.05}
      ASSEMBLE_BLOCK_INDEX_PENALTY: ${ASSEMBLE_BLOCK_INDEX_PENALTY:-0.01}
      TIME_FILTER_ENABLED: ${TIME_FILTER_ENABLED:-1}
      TIME_FILTER_MARGIN_SECONDS: ${TIME_FILTER_MARGIN_SECONDS:-86400}
      TIME_FILTER_MODE: ${TIME_FILTER_MODE:-hard}
      TIME_FILTER_BOUNDS_GUARD_ENABLED: ${TIME_FILTER_BOUNDS_GUARD_ENABLED:-1}
      TIME_FILTER_BOUNDS_CACHE_SECONDS: ${TIME_FILTER_BOUNDS_CACHE_SECONDS:-60}
      TIME_FILTER_BOUNDS_RETRY_SECONDS: ${TIME_FILTER_BOUNDS_RETRY_SECONDS:-5}
      TIME_FILTER_SOFT_DENSE_QUERIES: ${TIME_FILTER_SOFT_DENSE_QUERIES:-1}
      TIME_FILTER_SOFT_SPARSE_QUERIES: ${TIME_FILTER_SOFT_SPARSE_QUERIES:-1}
      TIME_FILTER_SOFT_PREFETCH_K: ${TIME_FILTER_SOFT_PREFETCH_K:-20}
      RERANK_ENABLED: ${RERANK_ENABLED:-0}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-jinaai/jina-reranker-v2-base-multilingual}
      RERANK_TOP_K: ${RERANK_TOP_K:-30}
      RERANK_MAX_DOC_CHARS: ${RERANK_MAX_DOC_CHARS:-2000}
    volumes:
      # Persists runtime model downloads (e.g. the reranker or a dense model
      # switched via env without --build) across container recreations.
      - search_models:/models
    ports:
      - "8002:8000"

volumes:
  qdrant_storage:
  index_models:
  search_models:
